<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

<title>Meeting - MeetUp</title>

<link rel="stylesheet" href="meeting.css">

</head>

<body>

<div class="meeting-page">


<!-- =========================
     HEADER
========================== -->

<header class="meeting-header">


    <!-- Left side -->

    <div class="header-left">

        <!-- Participant menu button -->

        <button
            type="button"
            class="participants-toggle"
            id="participantsToggle"
            aria-label="Open participants"
            aria-expanded="false"
        >

            <span></span>
            <span></span>
            <span></span>

        </button>


        <!-- MeetUp Logo -->

        <div class="meeting-brand">

            <span class="logo-mark">
                M
            </span>

            <span class="logo-text">
                MeetUp
            </span>

        </div>

    </div>


    <!-- Center Meeting Information -->

    <div class="meeting-info">

        <h1 id="meetingName">
            Meeting Room
        </h1>

        <p class="meeting-id">

            Room ID:

            <strong id="meetingPin">
                ------
            </strong>

        </p>

    </div>


    <!-- Leave -->

    <button
        type="button"
        class="leave-button"
        id="leaveButton"
    >
        Leave
    </button>

</header>



<!-- =========================
     MAIN CONTENT
========================== -->

<main class="meeting-main">


    <!-- =========================
         PARTICIPANT SIDEBAR
    ========================== -->

    <aside
        class="participants-sidebar"
        id="participantsSidebar"
    >


        <div class="participants-sidebar-header">


            <div>

                <h2>
                    People
                </h2>

                <p>
                    Participants
                </p>

            </div>


            <span id="participantCount">
                0
            </span>


        </div>


        <div
            class="participants-list"
            id="participantsList"
        >

            <!-- Participants loaded by JavaScript -->

        </div>


    </aside>




<!-- =========================
     MAIN / SCREEN SHARE STAGE
========================== -->

<section class="meeting-stage">


    <div class="stage-content">


        <!-- =========================
             SCREEN SHARE DISPLAY
        ========================== -->

        <div
            class="screen-share-area"
            id="screenShareArea"
        >


            <!--
                This video element will display
                the screen/window being shared.

                It is hidden until screen sharing
                actually starts.
            -->

            <video
                id="screenShareVideo"
                class="screen-share-video"
                autoplay
                playsinline
            ></video>


            <!-- =========================
                 EMPTY SCREEN STATE
            ========================== -->

            <div
                class="screen-share-placeholder"
                id="screenSharePlaceholder"
            >

                <div class="stage-icon">
                    🖥️
                </div>

                <h2>
                    Meeting Area
                </h2>

                <p>
                    Your screen sharing area will appear here.
                </p>

            </div>


            <!-- =========================
                 SCREEN SHARE CONTROLS
            ========================== -->

            <div class="screen-share-controls">


                <!-- Screen Share -->

                <button
                    type="button"
                    class="screen-share-button"
                    id="screenShareButton"
                >

                    🖥️

                    <span>
                        Share Screen
                    </span>

                </button>


                <!-- Screen Recording -->

                <button
                    type="button"
                    class="screen-record-button"
                    id="screenRecordButton"
                >

                    ⏺

                    <span>
                        Screen Record
                    </span>

                </button>


            </div>


        </div>


    </div>


</section>



    


    <!-- =========================
         CHAT
    ========================== -->

    <aside class="chat-section">


        <div class="chat-header">

            <div>

                <h2>
                    Chat
                </h2>

                <p>
                    Messages in this meeting
                </p>

            </div>

        </div>


        <!-- Messages scroll inside this area -->

        <div
            class="messages"
            id="messages"
        >

            <!-- Messages will appear here -->

        </div>


        <!-- Chat input stays at bottom -->

        <form
            class="chat-input-area"
            id="chatForm"
        >

            <input
                type="text"
                id="messageInput"
                placeholder="Type a message..."
                autocomplete="off"
            >

            <button
                type="submit"
                id="sendButton"
            >
                Send
            </button>

        </form>


    </aside>


</main>



<!-- =========================
     MEETING CONTROLS
========================== -->

<footer class="meeting-controls">


<button
    type="button"
    class="control-button"
    id="microphoneButton"
>

    🎤

    <span>
        Mic Off
    </span>

</button>


<button
    type="button"
    class="control-button"
    id="speakerButton"
>

    🔊

    <span>
        Speaker On
    </span>

</button>
    
<button
    type="button"
    class="control-button"
    id="copyLinkButton"
>

    🔗

    <span>
        Copy Link
    </span>

</button>





</footer>


</div>

<script src="meeting.js"></script>

</body>

</html>
